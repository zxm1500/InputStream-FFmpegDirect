name: Build inputstream.ffmpegdirect (Ubuntu 24.04)

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            gettext \
            autopoint \
            build-essential \
            cmake \
            ninja-build \
            git \
            unzip \
            zip \
            pkg-config \
            nasm \
            yasm \
            libx11-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libpulse-dev \
            libasound2-dev \
            libudev-dev \
            libdbus-1-dev \
            libssl-dev \
            python3 \
            python-is-python3 \
            perl

      - name: Clone Kodi (xbmc)
        run: |
          git clone --branch master --depth 1 https://github.com/xbmc/xbmc.git

      - name: Clone inputstream.ffmpegdirect
        run: |
          git clone --depth 1 https://github.com/xbmc/inputstream.ffmpegdirect.git

      - name: Configure addon build
        run: |
          mkdir -p inputstream.ffmpegdirect/build
          cd inputstream.ffmpegdirect/build
  
          cmake \
            -DADDONS_TO_BUILD=inputstream.ffmpegdirect \
            -DADDON_SRC_PREFIX=../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DPACKAGE_ZIP=1 \
            -DCMAKE_INSTALL_PREFIX=../../xbmc/build/addons \
            ../../xbmc/cmake/addons
  
      - name: Build addon
        run: |
          cd inputstream.ffmpegdirect/build
          make -j$(nproc)
  
      - name: Package addon zip
        run: |
          cd inputstream.ffmpegdirect/build
          make package-inputstream.ffmpegdirect
  
      - name: Collect zip
        run: |
          mkdir -p output
          find inputstream.ffmpegdirect/build/addons/packages \
            -name "inputstream.ffmpegdirect*.zip" -print
          find inputstream.ffmpegdirect/build/addons/packages \
            -name "inputstream.ffmpegdirect*.zip" -exec cp {} output/ \;
          ls -lh output
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inputstream.ffmpegdirect-ubuntu-24.04
          path: output/*.zip
